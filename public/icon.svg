<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#070a14" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Outer speed ring -->
  <circle cx="256" cy="256" r="180" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="198" stroke="#f97316" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 24"/>

  <!-- Glowing Lightning / Speed Bullet Vector -->
  <g filter="url(#neonGlow)">
    <!-- Speed streaks -->
    <path d="M120 180 L200 180" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M90 256 L180 256" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M130 330 L210 330" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

    <!-- Lightning Bolt / Bullet -->
    <polygon points="300,70 170,260 270,260 212,442 390,220 280,220" fill="url(#glowGrad)" />
    <!-- Core Hotspot Flare -->
    <circle cx="280" cy="235" r="14" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
